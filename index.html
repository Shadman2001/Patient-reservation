<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dr. Md. Sadikul Islam – Rheumatology Appointments</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

  <style>

    :root {
      --bg: #f4f9fd;
      --cd: #fff;
      --tx: #0f2233;
      --mu: #58708a;
      --pr: #0e7c86;
      --p2: #2b6fe0;
      --bd: #dce8f1;
      --no: #dc2626;
      --sh: 0 8px 30px rgba(15, 60, 90, .08);
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a1620;
        --cd: #11202d;
        --tx: #e7f1f8;
        --mu: #93aabd;
        --pr: #35c4d0;
        --p2: #7aa8ff;
        --bd: #1d3243;
        --sh: 0 8px 30px rgba(0, 0, 0, .4);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0a1620;
      --cd: #11202d;
      --tx: #e7f1f8;
      --mu: #93aabd;
      --pr: #35c4d0;
      --p2: #7aa8ff;
      --bd: #1d3243;
      --sh: 0 8px 30px rgba(0, 0, 0, .4);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 70px);
    }

    body {
      margin: 0;
      font-family: Inter, "Hind Siliguri", system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx);
      line-height: 1.55;
    }

    html[lang=bn] body { font-family: "Hind Siliguri", Inter, sans-serif; }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 10;
      background: var(--cd);
    }

    [hidden] { display: none !important; }
    a { color: inherit; text-decoration: none; }
    small, .mu { color: var(--mu); }

    h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.12; margin: .4em 0; }
    h2 { font-size: 1.7rem; margin: 0 0 20px; }
    h3 { margin: 0 0 8px; }

    section { padding: 54px 5vw; max-width: 1100px; margin: auto; }

    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 9;
      background: var(--cd);
      border-bottom: 1px solid var(--bd);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 5vw;
    }

    .lg { font-weight: 800; color: var(--pr); }
    .sp { flex: 1; }

    nav { display: flex; gap: 18px; margin-left: 14px; }
    nav a { color: var(--mu); font-size: .92rem; }
    @media (max-width: 760px) { nav { display: none; } }

    footer { text-align: center; padding: 30px; color: var(--mu); font-size: .85rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .row  { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 32px;
      align-items: center;
      padding-top: 44px;
    }
    @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }

    .pill {
      display: inline-block;
      background: color-mix(in srgb, var(--pr) 14%, transparent);
      color: var(--pr);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: .85rem;
      font-weight: 600;
    }

    .cr { color: var(--pr); letter-spacing: .02em; }

    #av {
      cursor: default;
      width: min(290px, 70vw);
      aspect-ratio: 1;
      border-radius: 50%;
      margin: auto;
      background: linear-gradient(135deg, var(--pr), var(--p2));
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 4rem;
      font-weight: 800;
      overflow: hidden;
      box-shadow: 0 20px 60px color-mix(in srgb, var(--pr) 40%, transparent);
      animation: fl 6s ease-in-out infinite;
    }
    #av img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes fl { 50% { transform: translateY(-8px); } }

    .btn {
      display: inline-block;
      border: 0;
      cursor: pointer;
      background: linear-gradient(135deg, var(--pr), var(--p2));
      color: #fff;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 600;
      font-size: .95rem;
      font-family: inherit;
      transition: .2s;
      box-shadow: var(--sh);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .ghost { background: transparent; color: var(--tx); border: 1px solid var(--bd); box-shadow: none; }
    .sm { padding: 8px 14px; }
    .ic { padding: 8px 12px; }

    .card, .opt {
      background: var(--cd);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--sh);
    }

    .num {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--pr);
      color: #fff;
      margin-bottom: 8px;
    }

    .opts { display: grid; gap: 10px; margin: 12px 0; }
    .opt {
      text-align: left;
      cursor: pointer;
      color: var(--tx);
      display: grid;
      gap: 2px;
      font-family: inherit;
      box-shadow: none;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chip {
      border: 1px solid var(--bd);
      background: var(--cd);
      color: var(--tx);
      padding: 8px 14px;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
    }
    .chip.sel, .opt.sel {
      border-color: var(--pr);
      background: color-mix(in srgb, var(--pr) 14%, var(--cd));
      outline: 2px solid var(--pr);
    }
    .chip:disabled { opacity: .35; text-decoration: line-through; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--bg);
      color: var(--tx);
      font-family: inherit;
      font-size: 1rem;
    }

    .fg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    @media (max-width: 560px) { .fg { grid-template-columns: 1fr; } }

    .err { color: var(--no); }

    .steps { display: flex; gap: 6px; margin-bottom: 16px; }
    .steps i { flex: 1; height: 5px; border-radius: 9px; background: var(--bd); }
    .steps i.on { background: var(--pr); }

    .li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--bd);
    }
    .li select { width: auto; }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    .stats div {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      color: var(--mu);
      font-size: .8rem;
    }
    .stats b { display: block; font-size: 1.5rem; color: var(--tx); }

    details {
      background: var(--cd);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 10px;
    }
    summary { cursor: pointer; font-weight: 600; }

    .rv { opacity: 0; transform: translateY(16px); transition: .6s; }
    .rv.in { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      .rv { opacity: 1; transform: none; transition: none; }
      #av { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>

<body>

<header>
  <span class="lg">✚ Dr. Md. Sadikul Islam</span>

  <nav>
    <a href="#about"    data-i="ab"></a>
    <a href="#cond"     data-i="cd"></a>
    <a href="#chambers" data-i="ch"></a>

<main>

  <section class="hero">
    <div>
      <span class="pill" data-i="ins"></span>
      <h1 data-i="h1"></h1>

    <div>
      <div id="av"></div>

      </p>

  <section id="about" class="rv">
    <h2 data-i="at"></h2>

    <h2 data-i="ht"></h2>

      <div class="card"><span class="num">1</span><b data-i="h_1"></b></div>

  <section id="mine">

      <input id="mp" inputmode="tel" placeholder="01XXXXXXXXX">
      <div id="ml"></div>

  <section id="faq" class="rv">
    <h2 data-i="ft"></h2>

  <section id="adm" hidden>
    <h2>Doctor dashboard</h2>
    <div class="card" id="ab"></div>
  </section>

</main>

<footer>
  © Dr. Md. Sadikul Islam · Rangpur Medical College ·
  <a href="#adm" id="al">Doctor login</a><br>
  Demo build: bookings are stored in this browser only.

<script>

const $ = s => document.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

let mem = {};
const S = {
  g(k, f) {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : (k in mem ? mem[k] : f);
    } catch (e) {
      return k in mem ? mem[k] : f;
    }
  },
  s(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
};

const CH = [
  {
    id: "opd",
    n: "RpMC Rheumatology OPD",
    d: [0, 1, 2, 3, 4],
    a: "09:00", b: "13:00",
    m: 15,
    fee: 00,
    addr: "Rangpur Medical College Hospital, Rangpur"
  },
  {
    id: "pvt",
    n: "Private Chamber",
    d: [0, 1, 2, 3, 6],
    a: "17:00", b: "21:00",
    m: 20,
    fee: 700,
    addr: "Rangpur (address to be updated)"
  }
];

const COND = [
  "Rheumatoid arthritis", "Lupus (SLE)", "Gout", "Ankylosing spondylitis",
  "Osteoarthritis", "Fibromyalgia", "Psoriatic arthritis", "Vasculitis"
];

const T = {
  en: {

    bk: "Book Appointment", ab: "About", cd: "Conditions", ch: "Chambers", fq: "FAQ", mb: "My bookings",

    h1: "Compassionate care for joint & autoimmune health",
    h2: "Book your visit with a rheumatology specialist in minutes – no calls, no queues.",
    rl: "Assistant Professor, Department of Rheumatology",
    ins: "Rangpur Medical College (RpMC)",

    at: "About the doctor",
    ax: "Dr. Md. Sadikul Islam (MBBS (RMC), FCPS, BCS) treats arthritis, lupus, gout and other autoimmune and musculoskeletal conditions, combining academic expertise with patient-first care.",

    ct: "Conditions treated",
    ht: "How booking works",
    h_1: "Choose chamber & time", h_2: "Enter your details", h_3: "Confirm with OTP",
    chT: "Chambers & fees",

    ft: "Frequently asked",
    q1: "Do I need an account?",     a1: "No – your mobile number and an OTP are enough.",
    q2: "Can I cancel a booking?",   a2: "Yes. Open “My bookings”, enter your phone number and cancel.",
    q3: "What should I bring?",      a3: "Previous prescriptions and test reports.",

    s1: "Choose chamber & visit type", s2: "Pick a date & time", s3: "Your details", s4: "Verify your phone",
    new: "New patient", fu: "Follow-up", on: "Online",
    next: "Next", back: "Back",
    nm: "Full name", ag: "Age", rs: "Reason / symptoms",
    conf: "Verify & confirm", otp: "Enter OTP",
    ok: "Booking confirmed!", code: "Your booking code", again: "Book another",

    cx: "Cancel", none: "No bookings found for this number.", mbT: "Find my bookings",

    dm: "Demo mode: no SMS is sent, so your OTP is",
    bad: "Please enter valid details (11-digit Bangladeshi mobile number).",
    wrong: "Wrong OTP.",
    taken: "Sorry, that slot was just taken. Please pick another."
  },

  bn: {
    bk: "অ্যাপয়েন্টমেন্ট নিন", ab: "পরিচিতি", cd: "রোগসমূহ", ch: "চেম্বার", fq: "প্রশ্নোত্তর", mb: "আমার বুকিং",
    h1: "জয়েন্ট ও অটোইমিউন রোগে আস্থার চিকিৎসা",
    h2: "মিনিটেই রিউমাটোলজি বিশেষজ্ঞের সিরিয়াল নিন – ফোন বা লাইনের ঝামেলা ছাড়াই।",
    rl: "সহকারী অধ্যাপক, রিউমাটোলজি বিভাগ",
    ins: "রংপুর মেডিকেল কলেজ (আরপিএমসি)",
    at: "চিকিৎসক পরিচিতি",
    ax: "ডা. মো. সাদিকুল ইসলাম (MBBS (RMC), FCPS, BCS) বাত, লুপাস, গাউটসহ অটোইমিউন ও হাড়-জয়েন্টের রোগের চিকিৎসা করেন।",
    ct: "যেসব রোগের চিকিৎসা হয়",
    ht: "বুকিং যেভাবে হয়",
    h_1: "চেম্বার ও সময় বাছুন", h_2: "তথ্য দিন", h_3: "ওটিপি দিয়ে নিশ্চিত করুন",
    chT: "চেম্বার ও ফি",
    ft: "সাধারণ জিজ্ঞাসা",
    q1: "অ্যাকাউন্ট লাগবে?",        a1: "না – মোবাইল নম্বর ও ওটিপিই যথেষ্ট।",
    q2: "বুকিং বাতিল করা যাবে?",     a2: "হ্যাঁ – “আমার বুকিং” এ ফোন নম্বর দিয়ে বাতিল করুন।",
    q3: "কী সঙ্গে আনব?",            a3: "আগের প্রেসক্রিপশন ও পরীক্ষার রিপোর্ট।",
    s1: "চেম্বার ও ভিজিটের ধরন", s2: "তারিখ ও সময় বাছুন", s3: "আপনার তথ্য", s4: "ফোন যাচাই",
    new: "নতুন রোগী", fu: "ফলো-আপ", on: "অনলাইন",
    next: "পরবর্তী", back: "পিছনে",
    nm: "পুরো নাম", ag: "বয়স", rs: "সমস্যা / লক্ষণ",
    conf: "যাচাই ও নিশ্চিত", otp: "ওটিপি দিন",
    ok: "বুকিং নিশ্চিত হয়েছে!", code: "আপনার বুকিং কোড", again: "আরেকটি বুকিং",
    cx: "বাতিল", none: "এই নম্বরে কোনো বুকিং নেই।", mbT: "আমার বুকিং খুঁজুন",
    dm: "ডেমো মোড: এসএমএস যায় না, তাই আপনার ওটিপি",
    bad: "সঠিক তথ্য দিন (১১ সংখ্যার মোবাইল নম্বর)।",
    wrong: "ওটিপি ভুল।",
    taken: "দুঃখিত, সময়টি এইমাত্র বুক হয়ে গেছে। অন্য সময় বাছুন।"
  }
};

let lg = S.g("lg", "en");
const t = k => T[lg][k] || T.en[k] || k;

const loc = () => lg == "bn" ? "bn-BD" : "en-GB";

const dn = d => new Date(2024, 0, 7 + d).toLocaleDateString(loc(), { weekday: "short" });

const iso = d =>
  d.getFullYear() + "-" +
  String(d.getMonth() + 1).padStart(2, "0") + "-" +
  String(d.getDate()).padStart(2, "0");

const mn = x => { const [h, m] = x.split(":").map(Number); return h * 60 + m; };

const fmtT = x => {
  const [h, m] = x.split(":");
  return (h % 12 || 12) + ":" + m + (h >= 12 ? " PM" : " AM");
};

function slots(c) {
  const r = [];
  for (let m = mn(c.a); m < mn(c.b); m += c.m) {
    r.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
  }
  return r;
}

function dates(c) {
  const o = [], n = new Date();
  for (let i = 0; i < 21; i++) {
    const d = new Date(n.getFullYear(), n.getMonth(), n.getDate() + i);
    if (c.d.includes(d.getDay())) o.push(d);
  }
  return o;
}

const ap  = () => S.g("ap", []);
const RST = () => ({ s: 1, ch: CH[0].id, ty: "new", dt: "", tm: "", f: {}, otp: "", er: "" });
let st = RST();

function R() {
  const c = CH.find(x => x.id == st.ch);

  let h = `<div class="steps">${[1, 2, 3, 4].map(i => `<i class="${st.s >= i ? "on" : ""}"></i>`).join("")}</div>`;

  if (st.s == 1) {
    h += `<h3>${t("s1")}</h3>
      <div class="opts">${CH.map(x => `
        <button class="opt ${x.id == st.ch ? "sel" : ""}" data-ch="${x.id}">
          <b>${x.n}</b><small>${x.addr}</small><small>৳${x.fee}</small>
        </button>`).join("")}
      </div>
      <div class="chips">${["new", "fu", "on"].map(k => `
        <button class="chip ${st.ty == k ? "sel" : ""}" data-ty="${k}">${t(k)}</button>`).join("")}
      </div>
      <button class="btn" data-go="2">${t("next")}</button>`;
  }

  else if (st.s == 2) {
    const bk  = new Set(ap().filter(a => a.ch == c.id && a.dt == st.dt && a.st != "cancelled").map(a => a.tm));
    const now = new Date();
    const td  = iso(now);

    h += `<h3>${t("s2")}</h3>
      <div class="chips">${dates(c).map(d => `
        <button class="chip ${iso(d) == st.dt ? "sel" : ""}" data-dt="${iso(d)}">
          ${d.toLocaleDateString(loc(), { weekday: "short", day: "numeric", month: "short" })}
        </button>`).join("")}
      </div>`;

    if (st.dt) {
      h += `<div class="chips">${slots(c).map(x => {
        const off = bk.has(x) || (st.dt == td && mn(x) <= now.getHours() * 60 + now.getMinutes());
        return `<button class="chip ${x == st.tm ? "sel" : ""}" ${off ? "disabled" : ""} data-tm="${x}">${fmtT(x)}</button>`;
      }).join("")}</div>`;
    }

    h += `<p class="err">${esc(st.er)}</p>
      <div class="row">
        <button class="btn ghost" data-go="1">${t("back")}</button>
        <button class="btn" data-go="3" ${st.tm ? "" : "disabled"}>${t("next")}</button>
      </div>`;
  }

  else if (st.s == 3) {
    const f = st.f;
    h += `<h3>${t("s3")}</h3>
      <div class="fg">
        <input id="nm" placeholder="${t("nm")}" value="${esc(f.nm)}">
        <input id="ag" type="number" min="0" max="120" placeholder="${t("ag")}" value="${esc(f.ag)}">
        <input id="ph" inputmode="tel" placeholder="01XXXXXXXXX" value="${esc(f.ph)}">
        <select id="py">${["Pay at chamber", "bKash (demo)", "Nagad (demo)"].map(x =>
          `<option ${f.py == x ? "selected" : ""}>${x}</option>`).join("")}
        </select>
      </div>
      <textarea id="rs" rows="3" placeholder="${t("rs")}">${esc(f.rs)}</textarea>
      <p class="err">${esc(st.er)}</p>
      <div class="row">
        <button class="btn ghost" data-go="2">${t("back")}</button>
        <button class="btn" data-go="4">${t("next")}</button>
      </div>`;
  }

  else if (st.s == 4) {
    h += `<h3>${t("s4")}</h3>
      <p class="mu">${t("dm")} <b>${st.otp}</b></p>
      <input id="ot" inputmode="numeric" maxlength="4" placeholder="${t("otp")}">
      <p class="err">${esc(st.er)}</p>
      <div class="row">
        <button class="btn ghost" data-go="3">${t("back")}</button>
        <button class="btn" data-ok="1">${t("conf")}</button>
      </div>`;
  }

  else {
    h += `<h3>✓ ${t("ok")}</h3>
      <div class="card">
        <p class="mu">${t("code")}</p>
        <h2>${st.code}</h2>
        <p>${c.n}<br>${st.dt} · ${fmtT(st.tm)}</p>
      </div>
      <div class="row"><button class="btn" data-rs="1">${t("again")}</button></div>`;
  }

  $("#bk").innerHTML = h;
}

const col = () => {
  st.f = {
    nm: $("#nm").value.trim(),
    ag: $("#ag").value,
    ph: $("#ph").value.trim(),
    py: $("#py").value,
    rs: $("#rs").value.trim()
  };
};

$("#bk").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;

  const d = b.dataset;
  if (st.s == 3) col();
  st.er = "";

  if (d.ch) { st.ch = d.ch; st.dt = st.tm = ""; }
  if (d.ty) st.ty = d.ty;
  if (d.dt) { st.dt = d.dt; st.tm = ""; }
  if (d.tm) st.tm = d.tm;

  if (d.go) {
    const g = +d.go;
    if (g == 4) {
      const f = st.f;
      if (f.nm.length < 2 || !/^01[3-9]\d{8}$/.test(f.ph) || !f.ag) {
        st.er = t("bad");
      } else {
        st.s = 4;
        st.otp = String(1000 + Math.floor(Math.random() * 9000));
      }
    } else {
      st.s = g;
    }
  }

  if (d.ok) {
    if ($("#ot").value != st.otp) {
      st.er = t("wrong");
    } else if (ap().some(a => a.ch == st.ch && a.dt == st.dt && a.tm == st.tm && a.st != "cancelled")) {
      st.er = t("taken");
      st.s = 2;
    } else {
      st.code = "RS-" + Math.random().toString(36).slice(2, 7).toUpperCase();
      const a = ap();
      a.push({ code: st.code, ch: st.ch, dt: st.dt, tm: st.tm, ty: st.ty, ...st.f, st: "booked" });
      S.s("ap", a);
      st.s = 5;
      MB();
    }
  }

  if (d.rs) st = RST();

  R();
};

function MB() {
  const p = $("#mp").value.trim();
  const l = ap().filter(a => p && a.ph == p);

  $("#ml").innerHTML = l.length
    ? l.map(a => `
        <div class="li">
          <div>
            <b>${esc(a.code)}</b> · ${CH.find(c => c.id == a.ch).n}<br>
            <small>${a.dt} · ${fmtT(a.tm)} · ${t(a.ty)} · ${a.st}</small>
          </div>
          ${a.st == "booked" ? `<button class="btn ghost sm" data-cx="${a.code}">${t("cx")}</button>` : ""}
        </div>`).join("")
    : `<p class="mu">${p ? t("none") : ""}</p>`;
}

$("#mp").oninput = MB;

$("#ml").onclick = e => {
  const c = e.target.dataset.cx;
  if (!c) return;
  const a = ap();
  a.find(r => r.code == c).st = "cancelled";
  S.s("ap", a);
  MB();
};

let ad = false;

function AD() {
  const e = $("#ab");

  if (!ad) {
    e.innerHTML = `
      <div class="row">
        <input id="pin" type="password" placeholder="PIN (demo: 1234)" style="max-width:220px">
        <button class="btn" id="pb">Login</button>
      </div>`;
    $("#pb").onclick = () => {
      if ($("#pin").value == "1234") { ad = true; AD(); }
      else $("#pin").style.borderColor = "var(--no)";
    };
    return;
  }

  const a  = ap();
  const td = iso(new Date());
  const f  = $("#fd") ? $("#fd").value : "";
  const l  = a.filter(x => !f || x.dt == f)
              .sort((x, y) => (x.dt + x.tm).localeCompare(y.dt + y.tm));

  e.innerHTML = `
    <div class="stats">
      <div><b>${a.length}</b>Total</div>
      <div><b>${a.filter(x => x.dt == td && x.st != "cancelled").length}</b>Today</div>
      <div><b>${a.filter(x => x.st == "booked" && x.dt >= td).length}</b>Upcoming</div>
      <div><b>${a.filter(x => x.st == "cancelled").length}</b>Cancelled</div>
    </div>

    <label class="mu">Filter by date
      <input id="fd" type="date" value="${f}" style="max-width:200px">
    </label>

    ${l.map(x => `
      <div class="li">
        <div>
          <b>${esc(x.nm)}</b> (${esc(x.ag)}) · ${esc(x.ph)}<br>
          <small>${x.dt} ${fmtT(x.tm)} · ${CH.find(c => c.id == x.ch).n} · ${esc(x.py)}<br>${esc(x.rs)}</small>
        </div>
        <select data-c="${x.code}">
          ${["booked", "arrived", "done", "no-show", "cancelled"].map(s =>
            `<option ${s == x.st ? "selected" : ""}>${s}</option>`).join("")}
        </select>
      </div>`).join("") || `<p class="mu">No appointments.</p>`}`;
}

$("#ab").onchange = e => {
  const x = e.target;
  if (x.dataset.c) {
    const a = ap();
    a.find(r => r.code == x.dataset.c).st = x.value;
    S.s("ap", a);
    AD();
  } else if (x.id == "fd") {
    AD();
  }
};

$("#al").onclick = e => {
  e.preventDefault();
  $("#adm").hidden = false;
  AD();
  $("#adm").scrollIntoView({ behavior: "smooth" });
};

function L2() {
  document.documentElement.lang = lg;
  document.querySelectorAll("[data-i]").forEach(n => n.textContent = t(n.dataset.i));
  $("#lb").textContent = lg == "en" ? "বাংলা" : "EN";

  $("#cl").innerHTML = COND.map(x => `<div class="card"><b>${x}</b></div>`).join("");

  $("#cc").innerHTML = CH.map(c => `
    <div class="card">
      <b>${c.n}</b>
      <p class="mu">${c.addr}</p>
      <p>${c.d.map(dn).join(", ")} · ${fmtT(c.a)}–${fmtT(c.b)}</p>
      <p><b>৳${c.fee}</b> <small>(sample)</small></p>
    </div>`).join("");

  $("#fl").innerHTML = [1, 2, 3].map(i => `
    <details>
      <summary>${t("q" + i)}</summary>
      <p class="mu">${t("a" + i)}</p>
    </details>`).join("");

  R();
  MB();
}

$("#lb").onclick = () => {
  lg = lg == "en" ? "bn" : "en";
  S.s("lg", lg);
  L2();
};

$("#tb").onclick = () => {

  const n = c == "dark" ? "light" : "dark";
  r.dataset.theme = n;
  S.s("th", n);
};
