e.innerHTML=`<div class="stats"><div><b>${a.length}</b>Total</div><div><b>${a.filter(x=>x.dt==td&&x.st!="cancelled").length}</b>Today</div><div><b>${a.filter(x=>x.st=="booked"&&x.dt>=td).length}</b>Upcoming</div><div><b>${a.filter(x=>x.st=="cancelled").length}</b>Cancelled</div></div><label class="mu">Filter by date <input id="fd" type="date" value="${f}" style="max-width:200px"></label>${l.map(x=>`<div class="li"><div><b>${esc(x.nm)}</b> (${esc(x.ag)}) · ${esc(x.ph)}<br><small>${x.dt} ${fmtT(x.tm)} · ${CH.find(c=>c.id==x.ch).n} · ${esc(x.py)}<br>${esc(x.rs)}</small></div><select data-c="${x.code}">${["booked","arrived","done","no-show","cancelled"].map(s=>`<option ${s==x.st?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||`<p class="mu">No appointments.</p>`}`}
$("#ab").onchange=e=>{const x=e.target;if(x.dataset.c){const a=ap();a.find(r=>r.code==x.dataset.c).st=x.value;S.s("ap",a);AD()}else if(x.id=="fd")AD()};
$("#al").onclick=e=>{e.preventDefault();$("#adm").hidden=false;AD();$("#adm").scrollIntoView({behavior:"smooth"})};
function L2(){document.documentElement.lang=lg;document.querySelectorAll("[data-i]").forEach(n=>n.textContent=t(n.dataset.i));$("#lb").textContent=lg=="en"?"বাংলা":"EN";
$("#cl").innerHTML=COND.map(x=>`<div class="card"><b>${x}</b></div>`).join("");
$("#cc").innerHTML=CH.map(c=>`<div class="card"><b>${c.n}</b><p class="mu">${c.addr}</p><p>${c.d.map(dn).join(", ")} · ${fmtT(c.a)}–${fmtT(c.b)}</p><p><b>৳${c.fee}</b> <small>(sample)</small></p></div>`).join("");
$("#fl").innerHTML=[1,2,3].map(i=>`<details><summary>${t("q"+i)}</summary><p class="mu">${t("a"+i)}</p></details>`).join("");R();MB()}
$("#lb").onclick=()=>{lg=lg=="en"?"bn":"en";S.s("lg",lg);L2()};
